<!doctype html>
<html lang="ja" class="h-full bg-transparent">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Graph</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    :root { --ink: #30271c; --muted: #766a59; --paper: rgba(255, 252, 242, .82); --red: #a9362b; --gold: #d49a22; --green: #5b842b; }
    ::-webkit-scrollbar-track { background: rgba(91, 132, 43, .08); }
    ::-webkit-scrollbar-thumb { background: rgba(91, 132, 43, .45); border-radius: 99px; }
    .network-canvas canvas { outline: none; }
    /* Tailwind の translate-x-full より優先して詳細パネルを表示する */
    #detailPanel.panel-open { transform: translateX(0); }
    .rasta-haze { background: rgba(255, 253, 248, .88); }
    .knowledge-shell { box-shadow: 0 10px 35px rgba(0, 0, 0, .07); }
    .knowledge-shell::after { content: ""; position: absolute; z-index: 10; right: 0; bottom: 0; left: 0; height: 6px; background: linear-gradient(90deg, #d62828, #f77f00, #ffd166, #80b918, #2a9d8f); background-size: 200% 100%; animation: rastaMove 8s ease infinite; opacity: .9; pointer-events: none; }
    @keyframes rastaMove { 0%, 100% { background-position: 0% } 50% { background-position: 100% } }
    .rasta-line { display: none; }
    .rasta-control { border-color: rgba(0, 0, 0, .09); background: rgba(255, 255, 255, .70); color: #222; box-shadow: none; }
    .rasta-control:focus { border-color: rgba(0, 0, 0, .25); box-shadow: 0 0 0 3px rgba(0, 0, 0, .04); }
    .rasta-button { border-color: rgba(0, 0, 0, .10); background: rgba(255, 255, 255, .62); color: #333; }
    .rasta-button:hover { border-color: rgba(0, 0, 0, .22); background: rgba(255, 255, 255, .95); }
    .graph-surface { background: rgba(255, 255, 255, .38); box-shadow: inset 0 1px rgba(255,255,255,.82); }
    .paper-panel { background: rgba(255, 253, 248, .98); color: #222; }
    .meta-pill { border: 1px solid rgba(0,0,0,.08); background: rgba(0,0,0,.035); color: #444; }
    .meta-pill:nth-child(2n), .meta-pill:nth-child(3n) { border-color: rgba(0,0,0,.08); background: rgba(0,0,0,.035); color: #444; }
    .note-card { border-color: rgba(0,0,0,.07); background: rgba(255,255,255,.55); color: #222; }
    .note-card:hover { border-color: rgba(0,0,0,.17); background: rgba(255,255,255,.92); }
    .rasta-segments { background: rgba(255,255,255,.50); }
    ::selection { background: rgba(212,154,34,.35); color: #30271c; }
    .virtual-office-title { background: linear-gradient(90deg, #D96B6B 0%, #DC766A 8%, #DF8069 16%, #E18B68 24%, #E49567 32%, #E6A066 40%, #E9AA65 48%, #E6C875 57%, #C4C97B 66%, #ACC186 75%, #9FC981 84%, #82BF83 92%, #68B984 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body class="h-full overflow-hidden bg-transparent font-sans text-stone-800">
  <main class="knowledge-shell rasta-haze relative mx-auto flex h-full max-w-7xl flex-col overflow-hidden rounded-3xl p-3 sm:p-5">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-black/5 pb-3">
      <div>
        <p class="virtual-office-title mb-1 text-sm font-bold uppercase tracking-[0.23em]">Virtual Office</p>
        <h1 class="text-xl font-bold tracking-tight text-[#222]">Knowledge Graph</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="status" class="rounded-full border border-stone-300 bg-white/60 px-2.5 py-1 text-xs text-stone-500">接続待機</span>
        <button id="refreshButton" class="rasta-button rounded-lg border px-3 py-1.5 text-xs font-medium transition focus:outline-none">↻ 更新</button>
      </div>
    </header>
    <div class="rasta-line mt-0.5 h-px w-full opacity-70"></div>

    <section class="mt-3 flex flex-col gap-2 sm:flex-row">
      <label class="relative flex-1">
        <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-stone-400">⌕</span>
        <input id="searchInput" type="search" placeholder="ノート、Index、タグを検索…" class="rasta-control w-full rounded-xl border py-2.5 pl-9 pr-3 text-sm outline-none placeholder:text-stone-400" />
      </label>
      <div class="rasta-segments flex rounded-xl border border-black/5 p-1">
        <button data-view="graph" class="view-button rounded-lg bg-[#222] px-3 py-1.5 text-xs font-medium text-white shadow-sm">グラフ</button>
        <button data-view="list" class="view-button rounded-lg px-3 py-1.5 text-xs font-medium text-stone-500 transition hover:text-stone-800">リスト</button>
      </div>
    </section>

    <section class="graph-surface relative mt-3 min-h-0 flex-1 overflow-hidden rounded-2xl border border-black/5 backdrop-blur-md">
      <div id="graphView" class="network-canvas absolute inset-0"></div>
      <div id="listView" class="absolute inset-0 hidden overflow-y-auto p-3 sm:p-5"></div>
      <div id="emptyState" class="pointer-events-none absolute inset-0 hidden items-center justify-center text-sm text-stone-500">一致するノートはありません</div>
      <div class="pointer-events-none absolute bottom-4 left-3 rounded-lg border border-black/5 bg-white/70 px-2 py-1 text-[10px] text-stone-500 backdrop-blur">ドラッグで移動・ホイールで拡大</div>
    </section>
  </main>

  <div id="panelShade" class="fixed inset-0 z-10 hidden bg-[#352817]/30 backdrop-blur-[1px]"></div>
  <aside id="detailPanel" class="paper-panel fixed inset-y-0 right-0 z-20 flex w-full max-w-md translate-x-full flex-col border-l border-black/5 shadow-2xl transition-transform duration-300">
    <div class="flex items-center justify-between border-b border-black/5 p-5">
      <p id="panelType" class="text-xs font-semibold uppercase tracking-[0.16em] text-stone-500">Note</p>
      <button id="closePanel" aria-label="パネルを閉じる" class="rounded-lg p-2 text-stone-500 hover:bg-[#f4e6bd] hover:text-stone-800">✕</button>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto p-5">
      <h2 id="panelTitle" class="text-xl font-bold leading-snug text-stone-800"></h2>
      <p id="panelSummary" class="mt-3 text-sm leading-7 text-stone-600"></p>
      <div id="panelTags" class="mt-4 flex flex-wrap gap-1.5"></div>
      <div class="mt-7 border-t border-black/5 pt-5">
        <p class="text-xs font-medium text-stone-500">関連するIndex</p>
        <div id="panelIndexes" class="mt-2 flex flex-wrap gap-2"></div>
      </div>
      <div id="panelReferencesSection" class="mt-6 hidden border-t border-black/5 pt-5">
        <p class="text-xs font-medium text-stone-500">関連ノート</p>
        <div id="panelReferences" class="mt-2 space-y-2"></div>
      </div>
    </div>
    <div class="border-t border-black/5 p-5">
      <a id="notionLink" target="_blank" rel="noopener noreferrer" class="block rounded-xl bg-gradient-to-r from-[#a9362b] via-[#d49a22] to-[#5b842b] px-4 py-3 text-center text-sm font-semibold text-white shadow-md transition hover:brightness-110">↗ Notionで開く</a>
    </div>
  </aside>

<script>
  // Cloudflare Worker API（実データ）。モック確認時だけ末尾に ?mock=1 を付けます。
  // API形式: { indexes: [{id,title,summary,appUrl}], notes: [{id,title,summary,type,tags,indexIds,referenceIds,appUrl}] }
  const API_URL = "https://knowledge-graph.rudywarrior-oct24.workers.dev/";
  const FORCE_MOCK = new URLSearchParams(location.search).get("mock") === "1";

  const mockData = {
    indexes: [
      { id: "idx-life", title: "Life OS", summary: "日々の暮らしと習慣を整えるための大分類。", category: "Life", genre: "Habits", appUrl: "https://www.notion.so/" },
      { id: "idx-work", title: "Creative Work", summary: "制作、発信、プロジェクト進行の知識。", appUrl: "https://www.notion.so/" },
      { id: "idx-learn", title: "Learning", summary: "読書・学習・考察を蓄積する棚。", appUrl: "https://www.notion.so/" }
    ],
    notes: [
      { id: "note-focus", title: "深い集中をつくる朝の設計", summary: "通知を切り、最初の90分を最重要タスクに使うための短い手順。", type: "Note", tags: ["習慣", "集中"], indexIds: ["idx-life", "idx-work"], referenceIds: ["note-journal"], appUrl: "https://www.notion.so/" },
      { id: "note-journal", title: "週次レビューの質問集", summary: "先週の行動を振り返り、次の一週間を穏やかに設計する質問。", type: "Journal", tags: ["レビュー", "内省"], indexIds: ["idx-life"], referenceIds: ["note-focus"], appUrl: "https://www.notion.so/" },
      { id: "note-writing", title: "文章の種を育てる方法", summary: "キャプチャから公開まで、アイデアを枯らさないための小さなワークフロー。", type: "Essay", tags: ["執筆", "創作"], indexIds: ["idx-work"], referenceIds: ["note-library"], appUrl: "https://www.notion.so/" },
      { id: "note-library", title: "読書ノートの再利用ルール", summary: "引用・自分の言葉・次の行動をつなぎ、読書を実践へ渡す。", type: "Book", tags: ["読書", "知識管理"], indexIds: ["idx-learn", "idx-work"], referenceIds: ["note-writing"], appUrl: "https://www.notion.so/" },
      { id: "note-tools", title: "個人ツールの選び方", summary: "新しいツールを導入する前に確認したい、運用コストと接続性の基準。", type: "Note", tags: ["ツール", "設計"], indexIds: ["idx-work", "idx-life"], referenceIds: [], appUrl: "https://www.notion.so/" }
    ]
  };

  const state = { data: mockData, network: null, currentView: "graph", query: "" };
  const graph = document.getElementById("graphView");
  const list = document.getElementById("listView");
  const empty = document.getElementById("emptyState");
  const status = document.getElementById("status");
  const panel = document.getElementById("detailPanel");
  const shade = document.getElementById("panelShade");

  function esc(value = "") { const div = document.createElement("div"); div.textContent = value; return div.innerHTML; }
  function typeColor(type) { return ({ "📝｜Memo／Idea": "#38bdf8", "💡｜Permanent": "#facc15", "🏗️｜Structure": "#fb923c", "🔗｜Reference": "#a78bfa", "📖｜Journal": "#34d399", "💴｜Finance": "#4ade80", "💼｜Work": "#f472b6" })[type] || "#38bdf8"; }
  function allItems() { return [...state.data.indexes.map(x => ({ ...x, kind: "Index", tags: [], indexIds: [], referenceIds: [] })), ...state.data.notes.map(x => ({ ...x, kind: "Note" }))]; }
  function filteredData() {
    const q = state.query.trim().toLowerCase();
    if (!q) return state.data;
    const hit = item => [item.title, item.summary, item.category, item.genre, ...(item.tags || [])].join(" ").toLowerCase().includes(q);
    const matchingNotes = state.data.notes.filter(hit);
    const indexIds = new Set(matchingNotes.flatMap(n => n.indexIds));
    return { indexes: state.data.indexes.filter(i => hit(i) || indexIds.has(i.id)), notes: matchingNotes };
  }

  function drawGraph() {
    const data = filteredData();
    const nodes = [
      ...data.indexes.map(index => ({ id: index.id, label: index.title, group: "index", shape: "box", margin: 12, borderWidth: 2, color: { background: "#fff2bf", border: "#8a6a17", highlight: { background: "#ffe17b", border: "#a9362b" } }, font: { color: "#30271c", face: "system-ui", bold: true, size: 14 } })),
      ...data.notes.map(note => ({ id: note.id, label: note.title, group: "note", shape: "dot", size: 17, color: { background: typeColor(note.type), border: "#fffdf5", highlight: { background: "#fffdf5", border: typeColor(note.type) } }, font: { color: "#30271c", face: "system-ui", size: 13, strokeWidth: 5, strokeColor: "#fffdf5" } }))
    ];
    const ids = new Set(nodes.map(n => n.id));
    const edges = data.notes.flatMap(note => [
      ...note.indexIds.filter(id => ids.has(id)).map(id => ({ from: id, to: note.id, color: { color: "#9b8a62", highlight: "#5b842b" }, width: 1.5 })),
      ...note.referenceIds.filter(id => ids.has(id)).map(id => ({ from: note.id, to: id, dashes: [4, 5], color: { color: "#b5a67e", highlight: "#a9362b" }, width: 1.2 }))
    ]);
    if (state.network) state.network.destroy();
    state.network = new vis.Network(graph, { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) }, {
      autoResize: true, physics: { stabilization: { iterations: 120 }, barnesHut: { gravitationalConstant: -4000, springLength: 130, springConstant: 0.04 } },
      interaction: { hover: true, navigationButtons: false, keyboard: true }, edges: { smooth: { type: "continuous" } }
    });
    state.network.on("click", params => { if (params.nodes.length) openPanel(params.nodes[0]); });
    empty.classList.toggle("hidden", nodes.length > 0); empty.classList.toggle("flex", nodes.length === 0);
  }

  function drawList() {
    const data = filteredData();
    const indexById = Object.fromEntries(state.data.indexes.map(index => [index.id, index.title]));
    list.innerHTML = data.notes.map(note => `<button data-id="${esc(note.id)}" class="note-card mb-2 w-full rounded-xl border p-4 text-left transition"><div class="flex items-start justify-between gap-3"><div><p class="text-sm font-semibold text-stone-800">${esc(note.title)}</p><p class="mt-1 line-clamp-2 text-xs leading-5 text-stone-500">${esc(note.summary)}</p></div><span class="shrink-0 rounded-full px-2 py-0.5 text-[10px] font-medium text-[#222]" style="background:${typeColor(note.type)}22">${esc(note.type)}</span></div><div class="mt-3 flex flex-wrap gap-1.5">${note.indexIds.map(id => `<span class="rounded bg-black/[.04] px-1.5 py-0.5 text-[10px] text-stone-700">${esc(indexById[id] || id)}</span>`).join("")}${note.tags.map(tag => `<span class="rounded bg-[#f8efd9] px-1.5 py-0.5 text-[10px] text-[#222]">#${esc(tag)}</span>`).join("")}</div></button>`).join("");
    list.querySelectorAll(".note-card").forEach(button => button.addEventListener("click", () => openPanel(button.dataset.id)));
    empty.classList.toggle("hidden", data.notes.length > 0); empty.classList.toggle("flex", data.notes.length === 0);
  }

  function openPanel(id) {
    const item = allItems().find(x => x.id === id); if (!item) return;
    const indexes = Object.fromEntries(state.data.indexes.map(x => [x.id, x]));
    const notes = Object.fromEntries(state.data.notes.map(x => [x.id, x]));
    document.getElementById("panelType").textContent = item.kind === "Index" ? "Index" : item.type || "Note";
    document.getElementById("panelTitle").textContent = item.title;
    document.getElementById("panelSummary").textContent = item.summary || "説明はまだありません。";
    const meta = item.kind === "Index" ? [item.category, item.genre].filter(Boolean) : item.tags || [];
    document.getElementById("panelTags").innerHTML = meta.map(tag => `<span class="meta-pill rounded-full px-2 py-1 text-xs">${item.kind === "Index" ? esc(tag) : "#" + esc(tag)}</span>`).join("");
    document.getElementById("panelIndexes").innerHTML = (item.kind === "Index" ? [item] : item.indexIds.map(id => indexes[id]).filter(Boolean)).map(index => `<button data-id="${esc(index.id)}" class="panel-index rounded-lg bg-black/[.04] px-2.5 py-1.5 text-xs text-stone-700 hover:bg-black/[.08]">${esc(index.title)}</button>`).join("") || '<span class="text-xs text-stone-400">関連なし</span>';
    document.querySelectorAll(".panel-index").forEach(button => button.addEventListener("click", () => openPanel(button.dataset.id)));
    const refs = item.kind === "Index" ? state.data.notes.filter(n => n.indexIds.includes(item.id)) : item.referenceIds.map(id => notes[id]).filter(Boolean);
    const refSection = document.getElementById("panelReferencesSection");
    refSection.classList.toggle("hidden", !refs.length);
    document.getElementById("panelReferences").innerHTML = refs.map(note => `<button data-id="${esc(note.id)}" class="panel-ref block w-full rounded-lg bg-[#f8efd9] px-3 py-2 text-left text-xs text-stone-600 hover:bg-[#f1dfb7]">${esc(note.title)}</button>`).join("");
    document.querySelectorAll(".panel-ref").forEach(button => button.addEventListener("click", () => openPanel(button.dataset.id)));
    const link = document.getElementById("notionLink"); link.href = item.appUrl || "https://www.notion.so/";
    panel.classList.add("panel-open"); shade.classList.remove("hidden");
  }
  function closePanel() { panel.classList.remove("panel-open"); shade.classList.add("hidden"); }
  function render() { drawGraph(); drawList(); graph.classList.toggle("hidden", state.currentView !== "graph"); list.classList.toggle("hidden", state.currentView !== "list"); }
  async function loadData() {
    status.textContent = "更新中…"; status.className = "rounded-full border border-[#d49a22]/40 bg-[#fff2cf] px-2.5 py-1 text-xs text-[#8a5d0d]";
    try {
      if (FORCE_MOCK) {
        state.data = mockData;
        status.textContent = "Mock preview";
        status.className = "rounded-full border border-stone-300 bg-white/60 px-2.5 py-1 text-xs text-stone-500";
        render();
        return;
      }
      const response = await fetch(API_URL); if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json(); if (!Array.isArray(data.indexes) || !Array.isArray(data.notes)) throw new Error("Invalid API data");
      state.data = data; status.textContent = "Live"; status.className = "rounded-full border border-[#5b842b]/35 bg-[#eaf1df] px-2.5 py-1 text-xs text-[#496d21]";
    } catch (error) {
      console.error("Knowledge Graph API error:", error);
      state.data = { indexes: [], notes: [] };
      status.textContent = "API error";
      status.className = "rounded-full border border-[#a9362b]/30 bg-[#f9e4df] px-2.5 py-1 text-xs text-[#963329]";
    }
    render();
  }
  document.getElementById("searchInput").addEventListener("input", event => { state.query = event.target.value; render(); });
  document.querySelectorAll(".view-button").forEach(button => button.addEventListener("click", () => { state.currentView = button.dataset.view; document.querySelectorAll(".view-button").forEach(b => b.className = `view-button rounded-lg px-3 py-1.5 text-xs font-medium transition ${b === button ? "bg-[#222] text-white shadow-sm" : "text-stone-500 hover:text-stone-800"}`); render(); }));
  document.getElementById("refreshButton").addEventListener("click", loadData);
  document.getElementById("closePanel").addEventListener("click", closePanel); shade.addEventListener("click", closePanel);
  loadData();
</script>
</body>
</html>
