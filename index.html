<!DOCTYPE html>
<html lang="ja" class="h-full bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Search Widget</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    .rasta-gradient-text {
      background: linear-gradient(135deg, #ff2a5f 0%, #ffbe0b 50%, #00f5d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body class="h-full flex flex-col p-2.5 box-border select-none overflow-hidden bg-slate-950 text-slate-100">

  <!-- TOP HEADER -->
  <header id="mainHeader" class="flex items-center justify-between gap-2 mb-2 pb-1.5 border-b border-slate-800/80">
    <div class="flex items-center gap-2">
      <h1 class="text-xs font-black tracking-widest rasta-gradient-text uppercase">NOTE SEARCH</h1>
      <span id="dataStatus" class="text-[9px] px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Loading...</span>
    </div>

    <div class="flex items-center gap-1.5">
      <div class="bg-slate-900 border border-slate-800 rounded-lg p-0.5 flex text-[11px]">
        <button id="btnViewGraph" onclick="switchView('graph')" class="px-2 py-0.5 rounded transition font-medium bg-indigo-600 text-white">
          🕸️ Graph
        </button>
        <button id="btnViewList" onclick="switchView('list')" class="px-2 py-0.5 rounded transition font-medium text-slate-400 hover:text-slate-200">
          📑 List
        </button>
      </div>
      <button onclick="fetchNotionData(true)" title="手動更新" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-2 py-0.5 rounded text-[11px] transition">
        🔄
      </button>
    </div>
  </header>

  <!-- ERROR DISPLAY CONTAINER -->
  <div id="errorBanner" class="hidden mb-2 p-2 bg-red-950/80 border border-red-800 text-red-200 rounded text-xs overflow-x-auto"></div>

  <!-- SEARCH BAR -->
  <div class="mb-2">
    <input type="text" id="searchInput" placeholder="🔍 ノート・キーワード・タイプ・ジャンルを検索..." 
      class="w-full bg-slate-900/90 border border-slate-800 rounded-lg px-3 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 placeholder-slate-500 transition">
  </div>

  <!-- MAIN CONTENT -->
  <main class="flex-1 relative min-h-0 border border-slate-800/80 rounded-xl overflow-hidden bg-slate-900/40">

    <!-- GRAPH VIEW -->
    <div id="viewGraph" class="w-full h-full relative">
      <div id="networkCanvas" class="w-full h-full bg-slate-950/60"></div>
      
      <div class="absolute bottom-1.5 left-1.5 bg-slate-950/80 backdrop-blur-md border border-slate-800/80 rounded-lg p-1.5 text-[9px] flex flex-wrap gap-2 text-slate-300 pointer-events-none max-w-[90%]">
        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#e056fd]"></span> Index</div>
        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#00f5d4]"></span> 🏗️ Structure</div>
        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#00b4d8]"></span> 💡 Permanent</div>
        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#a855f7]"></span> 🔗 Reference</div>
        <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-[#64748b]"></span> 他 Select</div>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div id="viewList" class="w-full h-full hidden grid grid-cols-3 gap-2 p-2">
      <!-- Index Column -->
      <div class="col-span-1 bg-slate-950/50 border border-slate-800/80 rounded-lg p-1.5 flex flex-col min-h-0">
        <div class="text-[9px] font-bold text-slate-500 uppercase px-1 py-0.5 flex justify-between">
          <span>Index</span>
          <span id="indexCount" class="bg-slate-800 px-1 rounded text-slate-400">0</span>
        </div>
        <div id="indexList" class="flex-1 overflow-y-auto space-y-1 mt-1"></div>
      </div>

      <!-- Notes Column -->
      <div class="col-span-2 bg-slate-950/50 border border-slate-800/80 rounded-lg p-1.5 flex flex-col min-h-0">
        <div class="text-[9px] font-bold text-slate-500 uppercase px-1 py-0.5 flex justify-between">
          <span id="currentFilterLabel">Notes</span>
          <span id="noteCount" class="bg-slate-800 px-1 rounded text-slate-400">0</span>
        </div>
        <div id="noteList" class="flex-1 overflow-y-auto space-y-1 mt-1"></div>
      </div>
    </div>

    <!-- SLIDE PANEL -->
    <div id="slidePanel" class="absolute top-0 right-0 w-72 h-full bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 transform translate-x-full transition-transform duration-300 ease-in-out p-3.5 flex flex-col justify-between z-20 shadow-2xl overflow-y-auto">
      <div>
        <div class="flex justify-between items-start mb-2">
          <span id="panelBadge" class="text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Type</span>
          <button onclick="closeSlidePanel()" class="text-slate-400 hover:text-white text-sm">✕</button>
        </div>
        <h2 id="panelTitle" class="text-xs font-bold text-slate-100 mb-2 leading-snug">Note Title</h2>
        
        <div class="space-y-2.5 text-xs text-slate-400 border-t border-slate-800/80 pt-2.5">
          <div>
            <span class="text-[9px] text-slate-500 block uppercase font-semibold">Type / Category</span>
            <span id="panelType" class="text-slate-200 font-medium text-xs">-</span>
          </div>
          <div>
            <span class="text-[9px] text-slate-500 block uppercase font-semibold mb-1">Index リレーション</span>
            <div id="panelIndexTags" class="flex flex-wrap gap-1"></div>
          </div>
          <div>
            <span class="text-[9px] text-slate-500 block uppercase font-semibold mb-1">Reference リレーション</span>
            <div id="panelRefTags" class="flex flex-wrap gap-1"></div>
          </div>
        </div>
      </div>

      <div class="pt-2.5 border-t border-slate-800 mt-2">
        <a id="panelAppBtn" href="#" target="_top" class="w-full block text-center bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-xs py-1.5 rounded-lg transition shadow decoration-none">
          🚀 Notionアプリで開く
        </a>
      </div>
    </div>

  </main>

  <script>
    // ★ご自身の WORKER URL を入力してください
    const WORKER_URL = "https://knowledge-shelf.rudywarrior-oct24.workers.dev";
    const HIDE_HEADER = false;

    if (HIDE_HEADER) {
      document.getElementById("mainHeader").style.display = "none";
    }

    const TYPE_STYLES = {
      "Index": { bg: "#e056fd", border: "#be2edd", size: 18, label: "Index" },
      "🏗️｜Structure": { bg: "#00f5d4", border: "#00bbf9", size: 14, label: "Structure" },
      "💡｜Permanent": { bg: "#00b4d8", border: "#0077b6", size: 10, label: "Permanent" },
      "🔗｜Reference": { bg: "#a855f7", border: "#7e22ce", size: 11, label: "Reference" },
      "📝｜Memo／Idea": { bg: "#f59e0b", border: "#d97706", size: 9, label: "Memo/Idea" },
      "📖｜Journal": { bg: "#ec4899", border: "#db2777", size: 9, label: "Journal" },
      "💴｜Finance": { bg: "#10b981", border: "#059669", size: 9, label: "Finance" },
      "💼｜Work": { bg: "#3b82f6", border: "#2563eb", size: 10, label: "Work" }
    };

    const DEFAULT_STYLE = { bg: "#64748b", border: "#475569", size: 9, label: "Note" };

    let state = {
      indexes: [],
      notes: [],
      selectedIndexId: null,
      searchQuery: "",
      network: null,
      nodesDataSet: null,
      edgesDataSet: null
    };

    function initNetwork() {
      const container = document.getElementById("networkCanvas");
      state.nodesDataSet = new vis.DataSet([]);
      state.edgesDataSet = new vis.DataSet([]);

      const data = { nodes: state.nodesDataSet, edges: state.edgesDataSet };
      const options = {
        nodes: {
          shape: "dot",
          font: { color: "#f8fafc", size: 10, face: "sans-serif" },
          borderWidth: 2,
          shadow: true
        },
        edges: {
          color: { color: "#334155", highlight: "#818cf8" },
          width: 1.2,
          smooth: { type: "continuous" }
        },
        physics: {
          solver: "forceAtlas2Based",
          forceAtlas2Based: { gravitationalConstant: -25, centralGravity: 0.01, springLength: 60 }
        },
        interaction: { hover: true, zoomView: true }
      };

      state.network = new vis.Network(container, data, options);

      state.network.on("click", function (params) {
        if (params.nodes.length > 0) {
          openSlidePanel(params.nodes[0]);
        } else {
          closeSlidePanel();
        }
      });
    }

    function loadNotionData(data) {
      state.indexes = data.indexes || [];
      state.notes = data.notes || [];

      const nodes = [];
      const edges = [];

      state.indexes.forEach(idx => {
        const style = TYPE_STYLES["Index"];
        nodes.push({
          id: idx.id,
          label: idx.title,
          size: style.size,
          color: { background: style.bg, border: style.border },
          type: "Index",
          raw: idx
        });
      });

      state.notes.forEach(note => {
        const style = TYPE_STYLES[note.type] || DEFAULT_STYLE;
        
        nodes.push({
          id: note.id,
          label: note.title,
          size: style.size,
          color: { background: style.bg, border: style.border },
          type: note.type,
          raw: note
        });

        (note.indexIds || []).forEach(indexId => {
          edges.push({ from: indexId, to: note.id });
        });

        (note.referenceIds || []).forEach(refId => {
          edges.push({ from: note.id, to: refId, dashes: true });
        });
      });

      state.nodesDataSet.clear();
      state.edgesDataSet.clear();
      state.nodesDataSet.add(nodes);
      state.edgesDataSet.add(edges);

      renderIndexList();
      renderNoteList();
    }

    function openSlidePanel(nodeId) {
      const node = state.nodesDataSet.get(nodeId);
      if (!node) return;

      const raw = node.raw;
      const isIndex = node.type === "Index";
      const style = TYPE_STYLES[node.type] || DEFAULT_STYLE;

      document.getElementById("panelTitle").innerText = raw.title;
      document.getElementById("panelType").innerText = isIndex ? (raw.category ? `Index (${raw.category})` : "Index") : node.type;
      
      const badge = document.getElementById("panelBadge");
      badge.innerText = style.label || node.type;
      badge.style.backgroundColor = style.bg;
      badge.style.color = "#0f172a";

      const idxContainer = document.getElementById("panelIndexTags");
      idxContainer.innerHTML = "";
      if (isIndex) {
        idxContainer.innerHTML = `<span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">大分類 (Index)</span>`;
      } else if (raw.indexIds && raw.indexIds.length > 0) {
        raw.indexIds.forEach(idxId => {
          const idxObj = state.indexes.find(i => i.id === idxId);
          if (idxObj) {
            idxContainer.innerHTML += `<span class="bg-purple-950/80 border border-purple-800/50 text-purple-300 px-1.5 py-0.5 rounded text-[10px]">${idxObj.title}</span>`;
          }
        });
      } else {
        idxContainer.innerHTML = `<span class="text-slate-600 text-[10px]">なし</span>`;
      }

      const refContainer = document.getElementById("panelRefTags");
      refContainer.innerHTML = "";
      if (!isIndex && raw.referenceIds && raw.referenceIds.length > 0) {
        raw.referenceIds.forEach(refId => {
          const refObj = state.notes.find(n => n.id === refId);
          if (refObj) {
            refContainer.innerHTML += `<span class="bg-cyan-950/80 border border-cyan-800/50 text-cyan-300 px-1.5 py-0.5 rounded text-[10px]">🔗 ${refObj.title}</span>`;
          }
        });
      } else {
        refContainer.innerHTML = `<span class="text-slate-600 text-[10px]">なし</span>`;
      }

      document.getElementById("panelAppBtn").href = raw.appUrl || "#";
      document.getElementById("slidePanel").classList.remove("translate-x-full");
    }

    function closeSlidePanel() {
      document.getElementById("slidePanel").classList.add("translate-x-full");
    }

    function renderIndexList() {
      document.getElementById("indexCount").innerText = state.indexes.length;
      let html = `
        <div onclick="filterByIndex(null)" class="px-2 py-1 rounded text-xs cursor-pointer truncate transition ${state.selectedIndexId === null ? 'bg-indigo-600/30 text-indigo-300 font-medium' : 'hover:bg-slate-800/50 text-slate-400'}">
          🌐 すべて表示
        </div>
      `;
      state.indexes.forEach(idx => {
        const isSelected = state.selectedIndexId === idx.id;
        const categoryBadge = idx.category ? `<span class="ml-1 text-[8px] px-1 py-0.1 bg-slate-800 text-slate-400 rounded">${idx.category}</span>` : '';
        html += `
          <div onclick="filterByIndex('${idx.id}')" class="px-2 py-1 rounded text-xs cursor-pointer truncate transition flex justify-between items-center ${isSelected ? 'bg-indigo-600/30 text-indigo-300 font-medium' : 'hover:bg-slate-800/50 text-slate-400'}">
            <span class="truncate">📂 ${idx.title}</span>
            ${categoryBadge}
          </div>
        `;
      });
      document.getElementById("indexList").innerHTML = html;
    }

    function renderNoteList() {
      let filtered = state.notes;
      if (state.selectedIndexId) {
        filtered = filtered.filter(n => (n.indexIds || []).includes(state.selectedIndexId));
      }
      if (state.searchQuery.trim() !== "") {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(n => n.title.toLowerCase().includes(q) || n.type.toLowerCase().includes(q));
      }

      document.getElementById("noteCount").innerText = filtered.length;
      if (filtered.length === 0) {
        document.getElementById("noteList").innerHTML = `<div class="text-xs text-slate-600 p-2">該当ノートなし</div>`;
        return;
      }

      let html = "";
      filtered.forEach(note => {
        const style = TYPE_STYLES[note.type] || DEFAULT_STYLE;
        html += `
          <div onclick="openSlidePanel('${note.id}')" class="p-1.5 rounded bg-slate-800/30 hover:bg-slate-800/80 border border-slate-800/50 hover:border-slate-700 transition cursor-pointer flex justify-between items-center gap-1">
            <span class="text-xs font-medium text-slate-200 truncate">${note.title}</span>
            <span class="text-[9px] px-1 py-0.2 rounded shrink-0" style="background-color: ${style.bg}22; color: ${style.bg}; border: 1px solid ${style.bg}44">${note.type}</span>
          </div>
        `;
      });
      document.getElementById("noteList").innerHTML = html;
    }

    function filterByIndex(id) {
      state.selectedIndexId = id;
      renderIndexList();
      renderNoteList();
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      renderNoteList();

      const q = state.searchQuery.toLowerCase();
      const allNodes = state.nodesDataSet.get();
      const updates = [];

      allNodes.forEach(node => {
        if (q === "") {
          updates.push({ id: node.id, opacity: 1.0 });
        } else {
          const match = node.label.toLowerCase().includes(q) || node.type.toLowerCase().includes(q) || (node.raw.category && node.raw.category.toLowerCase().includes(q));
          updates.push({ id: node.id, opacity: match ? 1.0 : 0.12 });
        }
      });
      state.nodesDataSet.update(updates);
    });

    function switchView(view) {
      const g = document.getElementById("viewGraph");
      const l = document.getElementById("viewList");
      const bg = document.getElementById("btnViewGraph");
      const bl = document.getElementById("btnViewList");

      if (view === "graph") {
        g.classList.remove("hidden");
        l.classList.add("hidden");
        bg.className = "px-2 py-0.5 rounded transition font-medium bg-indigo-600 text-white";
        bl.className = "px-2 py-0.5 rounded transition font-medium text-slate-400 hover:text-slate-200";
      } else {
        g.classList.remove("hidden");
        l.classList.remove("hidden");
        bl.className = "px-2 py-0.5 rounded transition font-medium bg-indigo-600 text-white";
        bg.className = "px-2 py-0.5 rounded transition font-medium text-slate-400 hover:text-slate-200";
      }
    }

    async function fetchNotionData(forceRefresh = false) {
      const errorBanner = document.getElementById("errorBanner");
      errorBanner.classList.add("hidden");

      if (!WORKER_URL || WORKER_URL.includes("YOUR-SUBDOMAIN")) {
        document.getElementById("dataStatus").innerText = "URL未設定";
        return;
      }

      try {
        const url = forceRefresh ? `${WORKER_URL}?refresh=1` : WORKER_URL;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          throw new Error(data.error);
        }

        loadNotionData(data);
        
        const status = document.getElementById("dataStatus");
        status.innerText = "Live";
        status.className = "text-[9px] px-1.5 py-0.2 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
      } catch (err) {
        console.error("API Fetch Error:", err);
        errorBanner.innerText = `🚨 エラー: ${err.message}`;
        errorBanner.classList.remove("hidden");
        document.getElementById("dataStatus").innerText = "Error";
        document.getElementById("dataStatus").className = "text-[9px] px-1.5 py-0.2 rounded bg-red-500/10 text-red-400 border border-red-500/20";
      }
    }

    initNetwork();
    fetchNotionData();
  </script>
</body>
</html>
